<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="How I work: goal, context, tasks, agents, verify, ship.">
  <defs>
    <style>
      .ink { fill: #17121a; } .paper { fill: #f2efec; } .rasp { fill: #c6427e; } .rose { fill: #bc979e; }
      .display { font-family: 'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 900; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
      .on { opacity: 0; animation: on 9s steps(1, end) infinite; }
      @keyframes on { 0% { opacity: 1; } 16.666% { opacity: 0; } 100% { opacity: 0; } }
      .bar { animation: bar 9s cubic-bezier(.7,0,.2,1) infinite; }
      @keyframes bar {
        0%,14% { transform: translateX(0); }
        16.666%,30.6% { transform: translateX(186.67px); }
        33.333%,47.3% { transform: translateX(373.33px); }
        50%,64% { transform: translateX(560.00px); }
        66.666%,80.6% { transform: translateX(746.67px); }
        83.333%,97.3% { transform: translateX(933.33px); }
        100% { transform: translateX(0); }
      }
      @media (prefers-reduced-motion: reduce) { .on, .bar { animation: none; } .on { opacity: 1; } }
    </style>
  </defs>
  <rect class="ink" width="1200" height="220"/>
  <text x="60" y="46" class="sans paper" font-size="16" font-weight="600">How I work</text>
  <rect x="40" y="188" width="1120" height="4" fill="#f2efec" fill-opacity="0.14"/>
  <rect class="rasp bar" x="40" y="186" width="187" height="8"/>
  <g>
    <text x="60" y="136" class="display rose" font-size="30" letter-spacing="-1">Goal</text>
    <text x="60" y="136" class="display paper on" font-size="30" letter-spacing="-1" style="animation-delay:0.0s">Goal</text>
    <text x="60" y="166" class="sans rose" font-size="15">what done looks like</text>
  </g>
  <g>
    <text x="247" y="136" class="display rose" font-size="30" letter-spacing="-1">Context</text>
    <text x="247" y="136" class="display paper on" font-size="30" letter-spacing="-1" style="animation-delay:1.5s">Context</text>
    <text x="247" y="166" class="sans rose" font-size="15">repo, docs, rules</text>
  </g>
  <rect x="227" y="70" width="2" height="110" fill="#f2efec" fill-opacity="0.14"/>
  <g>
    <text x="433" y="136" class="display rose" font-size="30" letter-spacing="-1">Tasks</text>
    <text x="433" y="136" class="display paper on" font-size="30" letter-spacing="-1" style="animation-delay:3.0s">Tasks</text>
    <text x="433" y="166" class="sans rose" font-size="15">small and verifiable</text>
  </g>
  <rect x="413" y="70" width="2" height="110" fill="#f2efec" fill-opacity="0.14"/>
  <g>
    <text x="620" y="136" class="display rose" font-size="30" letter-spacing="-1">Agents</text>
    <text x="620" y="136" class="display paper on" font-size="30" letter-spacing="-1" style="animation-delay:4.5s">Agents</text>
    <text x="620" y="166" class="sans rose" font-size="15">one lead, many workers</text>
  </g>
  <rect x="600" y="70" width="2" height="110" fill="#f2efec" fill-opacity="0.14"/>
  <g>
    <text x="807" y="136" class="display rose" font-size="30" letter-spacing="-1">Verify</text>
    <text x="807" y="136" class="display paper on" font-size="30" letter-spacing="-1" style="animation-delay:6.0s">Verify</text>
    <text x="807" y="166" class="sans rose" font-size="15">tests, review, QA</text>
  </g>
  <rect x="787" y="70" width="2" height="110" fill="#f2efec" fill-opacity="0.14"/>
  <g>
    <text x="993" y="136" class="display rose" font-size="30" letter-spacing="-1">Ship</text>
    <text x="993" y="136" class="display paper on" font-size="30" letter-spacing="-1" style="animation-delay:7.5s">Ship</text>
    <text x="993" y="166" class="sans rose" font-size="15">a working app</text>
  </g>
  <rect x="973" y="70" width="2" height="110" fill="#f2efec" fill-opacity="0.14"/>
</svg>
