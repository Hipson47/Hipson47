<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Hipson47. AI-assisted app builder, full-stack prototyper, workflow designer.">
  <defs>
    <!-- palette sampled from the avatar: ink, paper, raspberry, dusty rose -->
    <style>
      .ink { fill: #17121a; }
      .paper { fill: #f2efec; }
      .rasp { fill: #c6427e; }
      .rose { fill: #bc979e; }
      .display { font-family: 'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 900; }
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }

      .word { opacity: 0; animation: word 12s steps(1, end) infinite; }
      .w1 { animation-delay: 0s; } .w2 { animation-delay: 2s; } .w3 { animation-delay: 4s; }
      .w4 { animation-delay: 6s; } .w5 { animation-delay: 8s; } .w6 { animation-delay: 10s; }
      @keyframes word { 0% { opacity: 1; } 16.666% { opacity: 0; } 100% { opacity: 0; } }

      .slam { animation: slam 2s cubic-bezier(.2,.9,.25,1) infinite; transform-origin: 900px 205px; }
      @keyframes slam { 0% { transform: translateX(-36px) scale(1.06); } 18% { transform: translateX(0) scale(1); } 100% { transform: translateX(0) scale(1); } }

      .speed { animation: speed 2s ease-out infinite; }
      @keyframes speed { 0% { opacity: .55; transform: translateX(40px); } 30% { opacity: 0; transform: translateX(-60px); } 100% { opacity: 0; } }

      .tone { animation: tone 24s linear infinite; }
      @keyframes tone { from { transform: translate(0,0); } to { transform: translate(-48px,-48px); } }

      .rise { transform: translateY(110px); animation: rise .9s cubic-bezier(.16,1,.3,1) .1s forwards; }
      .rise2 { opacity: 0; animation: fade .6s ease-out .7s forwards; }
      @keyframes rise { to { transform: translateY(0); } }
      @keyframes fade { to { opacity: 1; } }

      .tick { transform: scaleX(0); transform-origin: 676px 0; animation: tick 2s linear infinite; }
      @keyframes tick { from { transform: scaleX(0); } to { transform: scaleX(1); } }

      @media (prefers-reduced-motion: reduce) {
        .word, .slam, .speed, .tone, .tick { animation: none; }
        .w1 { opacity: 1; }
        .rise { transform: none; animation: none; }
        .rise2 { opacity: 1; animation: none; }
      }
    </style>

    <!-- manga screentone: dot size ramps from left to right -->
    <pattern id="dotS" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="6" cy="6" r="1.3" fill="#17121a"/></pattern>
    <pattern id="dotM" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="6" cy="6" r="2.4" fill="#17121a"/></pattern>
    <pattern id="dotL" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="6" cy="6" r="3.6" fill="#17121a"/></pattern>

    <clipPath id="nameClip"><rect x="56" y="70" width="600" height="140"/></clipPath>
    <clipPath id="panel"><rect x="676" y="28" width="496" height="324"/></clipPath>
  </defs>

  <!-- page -->
  <rect class="ink" width="1200" height="380"/>

  <!-- left: identity -->
  <g clip-path="url(#nameClip)">
    <text class="display paper rise" x="56" y="190" font-size="104" letter-spacing="-4">Hipson47</text>
  </g>
  <rect class="rasp rise2" x="60" y="214" width="72" height="8"/>
  <g class="rise2">
    <text class="sans paper" x="58" y="266" font-size="24" font-weight="600">AI-assisted app builder.</text>
    <text class="sans rose" x="58" y="300" font-size="24">Full-stack prototyper, workflow designer.</text>
  </g>

  <!-- right: raspberry panel with screentone and the process, one word at a time -->
  <g clip-path="url(#panel)">
    <rect class="rasp" x="676" y="28" width="496" height="324"/>
    <g class="tone" opacity="0.22">
      <rect x="676" y="0" width="240" height="420" fill="url(#dotS)"/>
      <rect x="916" y="0" width="160" height="420" fill="url(#dotM)"/>
      <rect x="1076" y="0" width="160" height="420" fill="url(#dotL)"/>
    </g>

    <!-- speed lines, fired on every word change -->
    <g class="speed" stroke="#f2efec" stroke-width="3" stroke-linecap="square">
      <line x1="1000" y1="120" x2="1160" y2="120"/>
      <line x1="1040" y1="150" x2="1170" y2="150"/>
      <line x1="980" y1="262" x2="1150" y2="262"/>
      <line x1="1060" y1="290" x2="1170" y2="290"/>
    </g>

    <g class="slam">
      <g class="display paper" font-size="88" letter-spacing="-3">
        <text class="word w1" x="712" y="236">Goal.</text>
        <text class="word w2" x="712" y="236">Context.</text>
        <text class="word w3" x="712" y="236">Tasks.</text>
        <text class="word w4" x="712" y="236">Agents.</text>
        <text class="word w5" x="712" y="236">Verify.</text>
        <text class="word w6" x="712" y="236">Ship.</text>
      </g>
    </g>

    <text class="mono ink" x="712" y="84" font-size="15" font-weight="700">idea to working app</text>
    <rect class="ink" x="676" y="340" width="496" height="12"/>
    <rect class="paper tick" x="676" y="340" width="496" height="12"/>
  </g>

  <!-- ink frame around the panel, like a manga cell -->
  <rect x="676" y="28" width="496" height="324" fill="none" stroke="#f2efec" stroke-width="4"/>
</svg>
